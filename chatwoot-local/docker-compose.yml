services:
  rails:
    image: 'ghcr.io/fazer-ai/chatwoot:latest'
    platform: linux/amd64
    pull_policy: always
    volumes:
      - 'storage:/app/storage'
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      DEFAULT_LOCALE: pt_BR
      FRONTEND_URL: ${FRONTEND_URL}
      INTERNAL_HOST_URL: http://rails:3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DATABASE: ${POSTGRES_DB:-chatwoot_production}
      SECRET_KEY_BASE: ${SERVICE_PASSWORD_64_SECRETKEYBASE}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
      BAILEYS_PROVIDER_DEFAULT_CLIENT_NAME: ${BAILEYS_PROVIDER_DEFAULT_CLIENT_NAME}
      BAILEYS_PROVIDER_DEFAULT_URL: http://baileys-api:3025
      BAILEYS_PROVIDER_DEFAULT_API_KEY: ${SERVICE_PASSWORD_64_BAILEYSDEFAULTAPIKEY}
      BAILEYS_PROVIDER_USE_INTERNAL_HOST_URL: 'true'
    entrypoint: docker/entrypoints/rails.sh
    command: [ 'bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0' ]
    restart: always
    ports:
      - '3000:3000'
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ || exit 1' ]
      interval: 60s
      timeout: 20s
      retries: 10

  sidekiq:
    image: 'ghcr.io/fazer-ai/chatwoot:latest'
    platform: linux/amd64
    pull_policy: always
    volumes:
      - 'storage:/app/storage'
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      FRONTEND_URL: ${FRONTEND_URL}
      INTERNAL_HOST_URL: http://rails:3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DATABASE: ${POSTGRES_DB:-chatwoot_production}
      SECRET_KEY_BASE: ${SERVICE_PASSWORD_64_SECRETKEYBASE}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
      BAILEYS_PROVIDER_DEFAULT_CLIENT_NAME: ${BAILEYS_PROVIDER_DEFAULT_CLIENT_NAME}
      BAILEYS_PROVIDER_DEFAULT_URL: http://baileys-api:3025
      BAILEYS_PROVIDER_DEFAULT_API_KEY: ${SERVICE_PASSWORD_64_BAILEYSDEFAULTAPIKEY}
      BAILEYS_PROVIDER_USE_INTERNAL_HOST_URL: 'true'
    command: [ 'bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml' ]
    restart: always
    healthcheck:
      test: [ 'CMD-SHELL', 'ps aux | grep [s]idekiq' ]
      interval: 20s
      timeout: 20s
      retries: 10

  postgres:
    image: 'pgvector/pgvector:pg16'
    platform: linux/amd64
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - 'postgres:/var/lib/postgresql/data'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatwoot_production}
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 20s
      timeout: 20s
      retries: 10

  redis:
    image: 'redis:alpine'
    platform: linux/amd64
    restart: always
    command: [ 'sh', '-c', 'redis-server --requirepass "${SERVICE_PASSWORD_REDIS}"' ]
    volumes:
      - 'redis:/data'
    environment:
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
    healthcheck:
      test: [ 'CMD-SHELL', 'redis-cli -h localhost -p 6379 -a $${REDIS_PASSWORD} ping' ]
      interval: 20s
      timeout: 20s
      retries: 10

  baileys-api:
    image: "baileys-api:local"
    platform: linux/amd64
    build:
      context: ./baileys-api
    volumes:
      - "storage:/app/storage"
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BAILEYS_LOG_LEVEL: ${BAILEYS_LOG_LEVEL:-error}
      BAILEYS_PROVIDER_DEFAULT_API_KEY: ${SERVICE_PASSWORD_64_BAILEYSDEFAULTAPIKEY}
    command: [ "sh", "-c", "bun manage-api-keys create user ${SERVICE_PASSWORD_64_BAILEYSDEFAULTAPIKEY} && bun start" ]
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3025/status" ]
      interval: 20s
      timeout: 20s
      retries: 10

  n8n:
    image: n8nio/n8n
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-chatwoot_production}
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${SERVICE_USER_POSTGRES}
      - DB_POSTGRESDB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - WEBHOOK_TUNNEL_URL=https://4fd1-2804-461c-9098-a800-a98c-de40-f137-9336.ngrok-free.app

    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - '5678:5678'
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: [ "sh", "-c", "mkdir -p /home/node/.n8n && n8n start" ]

volumes:
  storage:
  postgres:
  redis:
  n8n_data:
